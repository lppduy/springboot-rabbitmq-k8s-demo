name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Run tests - Order Service
        run: |
          cd order-service
          mvn clean test
      
      - name: Run tests - Notification Service
        run: |
          cd notification-service
          mvn clean test
      
      - name: Generate test coverage report
        run: |
          cd order-service
          mvn jacoco:report
          cd ../notification-service
          mvn jacoco:report
      
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            order-service/target/site/jacoco/
            notification-service/target/site/jacoco/
          retention-days: 7
