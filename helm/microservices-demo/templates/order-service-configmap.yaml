{{- if .Values.orderService.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  labels:
    app: order-service
data:
  db.host: {{ .Values.orderService.database.host | quote }}
  db.port: {{ .Values.orderService.database.port | quote }}
  db.name: {{ .Values.orderService.database.name | quote }}
  rabbitmq.host: {{ .Values.orderService.rabbitmq.host | quote }}
  rabbitmq.port: {{ .Values.orderService.rabbitmq.port | quote }}
{{- end }}
