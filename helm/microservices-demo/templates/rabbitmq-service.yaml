{{- if .Values.rabbitmq.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
  labels:
    app: rabbitmq
spec:
  type: {{ .Values.rabbitmq.service.type }}
  ports:
  - port: {{ .Values.rabbitmq.service.amqpPort }}
    targetPort: 5672
    protocol: TCP
    name: amqp
  - port: {{ .Values.rabbitmq.service.managementPort }}
    targetPort: 15672
    protocol: TCP
    name: management
  selector:
    app: rabbitmq
{{- end }}
