server:
  port: 8082

spring:
  application:
    name: notification-service
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  
  # RabbitMQ Configuration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
    connection-timeout: 10000
    # Consumer configuration
    listener:
      simple:
        acknowledge-mode: auto  # auto, manual, none
        prefetch: 1             # Number of messages to prefetch
        retry:
          enabled: true
          initial-interval: 3000
          max-attempts: 3

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    try-it-out-enabled: true

# Actuator Configuration
# Expose health endpoints for K8s probes and monitoring
management:
  endpoints:
    web:
      exposure:
        include: health  # Only expose health endpoint
  endpoint:
    health:
      probes:
        enabled: true  # Enable for K8s liveness/readiness probes
      show-details: always  # Show details for debugging
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    # Configure health indicators
    rabbit:
      enabled: true  # Check RabbitMQ connection
    diskspace:
      enabled: false  # Disable disk space check for demo

# Logging Configuration
logging:
  level:
    root: INFO
    com.demo.notification: DEBUG
    org.springframework.amqp: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
